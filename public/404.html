<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Wanderlust</title>
    <script>
      // GitHub Pages SPA redirect trick:
      // When GitHub Pages can't find a file (e.g., /destination/bali),
      // it serves this 404.html. This script redirects to the main page
      // with the original path encoded in a query parameter. The app's
      // index.html then reads that parameter and navigates to the right route.
      var pathSegmentsToKeep = 1; // Keep /wanderlust/ prefix
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
